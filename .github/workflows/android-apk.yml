name: Build APK Android

# Chạy mỗi khi push lên main, hoặc bấm tay trong tab Actions
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Lấy code
        uses: actions/checkout@v4

      - name: Cài Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cài JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Thiết lập Android SDK
        uses: android-actions/setup-android@v3

      - name: Cài dependency
        run: npm ci

      - name: Kiểm tra TypeScript
        run: npx tsc --noEmit

      # Sinh thư mục android/ từ app.json. Thư mục này KHÔNG commit vào repo,
      # nên mỗi lần build đều dựng lại từ config — không bị lệch cấu hình.
      - name: Sinh project Android (expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Expo cấu hình sẵn buildType release ký bằng debug.keystore đi kèm,
      # nên APK ra là đã ký và cài được ngay, không cần thêm secret nào.
      # Chỉ build cho CPU ARM (điện thoại/tablet thật) để nhẹ và nhanh hơn.
      - name: Build APK release
        run: |
          set -euo pipefail
          cd android
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Kiểm tra APK đã được ký hợp lệ
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK: $APK"
          ls -lh "$APK"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | grep -E "^package|application-label|sdkVersion|native-code" || true
          echo "✅ APK hợp lệ và đã được ký"

      - name: Tải APK lên artifact
        uses: actions/upload-artifact@v4
        with:
          name: lop3-study-game-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
